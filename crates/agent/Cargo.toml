[package]
name = "eduguard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EduGuard device agent for Windows, macOS and Linux"

[[bin]]
name = "eduguard-agent"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
sysinfo = "0.39"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSString", "NSRunLoop", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSButton", "NSColor", "NSFont", "NSGraphics", "NSMenu", "NSMenuItem",
    "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem",
    "NSTextField", "NSView", "NSWindow", "NSGraphicsContext", "NSWorkspace",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
